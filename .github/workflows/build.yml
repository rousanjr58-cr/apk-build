name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          echo "Using $ZIP"
          unzip -q "$ZIP" -d project
          DIR=$(dirname "$(find project -name settings.gradle.kts | head -1)")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: cd "$PROJECT_DIR" && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MultiAspectRecorder-apk
          path: project/**/app-debug.apk
